name: Publish Release

on:
  push:
    tags:
      - 'v*'  # Push events to matching v*, i.e. v1.0, v20.15.10
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_release:
    name: Build release on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact_name: nxc
            asset_name: nxc-linux-amd64
          - os: macos-latest
            artifact_name: nxc
            asset_name: nxc-macos-amd64
          - os: windows-latest
            artifact_name: nxc.exe
            asset_name: nxc-windows-amd64.exe

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Rust
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      with:
        toolchain: stable
        
    - name: Rust Cache
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

    - name: Install dependencies (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libkrb5-dev

    - name: Build Release Binary
      run: cargo build --release --workspace

    - name: Smoke Test Release Binary
      shell: bash
      run: |
        ./target/release/${{ matrix.artifact_name }} --help

    - name: Build Debian Package (Linux only)
      if: matrix.os == 'ubuntu-latest'
      run: |
        cargo install cargo-deb
        cargo deb -p nxc --no-build -o target/release/nxc-rs-amd64.deb

    - name: Pre-Package Binary Rename
      shell: bash
      run: |
        mv target/release/${{ matrix.artifact_name }} target/release/${{ matrix.asset_name }}

    - name: Generate Checksums
      shell: bash
      run: |
        cd target/release
        if command -v sha256sum >/dev/null 2>&1; then
          sha256sum ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256
        elif command -v shasum >/dev/null 2>&1; then
          shasum -a 256 ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256
        fi

    - name: Generate SBOM
      if: matrix.os == 'ubuntu-latest'
      uses: anchore/sbom-action@v0
      with:
        path: ./
        format: cyclonedx-json
        output-file: target/release/nxc-rs-sbom.json

    - name: Upload Binary to Release
      uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          target/release/${{ matrix.asset_name }}
          target/release/${{ matrix.asset_name }}.sha256
          target/release/*.deb
          target/release/nxc-rs-sbom.json
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
