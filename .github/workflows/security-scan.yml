name: Security & Secret Scan

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret Leak Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate .env.example has zero live secrets
        shell: bash
        run: |
          echo "Scanning .env.example for accidental secrets..."
          while IFS= read -r line || [[ -n "$line" ]]; do
            # Skip comments and empty lines
            [[ "$line" =~ ^[[:space:]]*# ]] && continue
            [[ -z "${line// }" ]] && continue
            if [[ "$line" =~ ^[A-Z0-9_]*(KEY|SECRET|TOKEN|PASSWORD|API) ]]; then
              val=$(echo "$line" | cut -d'=' -f2- | tr -d '"' | tr -d "'" | tr -d '[:space:]')
              if [[ -n "$val" && "$val" != "placeholder" && "$val" != "test" && "$val" != "10000" ]]; then
                echo "::error file=.env.example::Detected non-empty secret key in .env.example: $line"
                exit 1
              fi
            fi
          done < .env.example
          echo "Validation passed: .env.example contains only empty/safe template values."
