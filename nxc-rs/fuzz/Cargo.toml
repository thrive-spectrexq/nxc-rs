[package]
name = "nxc-fuzz"
version = "0.1.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
nxc-auth = { path = "../auth" }
anyhow = "1.0"
tempfile = "3.10.0"

[[bin]]
name = "ntlm_parse"
path = "fuzz_targets/ntlm_parse.rs"
test = false
doc = false

[[bin]]
name = "kerberos_ccache"
path = "fuzz_targets/kerberos_ccache.rs"
test = false
doc = false
