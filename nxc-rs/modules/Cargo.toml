[package]
name = "nxc-modules"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "NetExec-RS module system — secretsdump, BloodHound, Kerberoast, and more"


[lints]
workspace = true

[dependencies]

nxc-protocols = { path = "../protocols" }
nxc-auth = { path = "../auth" }
async-trait = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ldap3 = { workspace = true }
chrono = { workspace = true }
hex = { workspace = true }
bytes = { workspace = true }
reqwest = { workspace = true, features = ["multipart"] }
zip = "8.5"
base64 = { workspace = true }
uuid = { workspace = true }
rhai = { version = "1.25", features = ["sync"] }
ssh2 = { workspace = true }
suppaftp = { workspace = true }
rasn = { workspace = true }

[features]
opcua-support = ["nxc-protocols/opcua-support"]

[dev-dependencies]
nxc-db = { path = "../db" }

