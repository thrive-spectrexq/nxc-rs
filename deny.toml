# cargo-deny configuration for nxc-rs
# Run: cargo deny check (install: cargo install cargo-deny)

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

# ─── Advisory Database ──────────────────────────────────────────
[advisories]
unmaintained = "workspace"
yanked = "warn"
ignore = [
    "RUSTSEC-2026-0249", # smartstring unmaintained (transitive via rhai)
    "RUSTSEC-2021-0139", # ansi_term unmaintained
    "RUSTSEC-2024-0375", # atty unmaintained
    "RUSTSEC-2024-0384", # instant unmaintained
    "RUSTSEC-2024-0436", # paste unmaintained
]

# ─── License Compliance ─────────────────────────────────────────
[licenses]
# Dual licenses (e.g. `MIT OR Apache-2.0`) are automatically allowed if at least one license is approved below.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "bzip2-1.0.6",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "NCSA",
    "OFL-1.1",
    "OpenSSL",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]
exceptions = [
    { allow = ["GPL-2.0-or-later"], name = "nt-hive" }
]
confidence-threshold = 0.7

[licenses.private]
ignore = true
registries = []

# ─── Crate Bans ─────────────────────────────────────────────────
[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

# ─── Source Restrictions ─────────────────────────────────────────
[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = [
    "https://github.com/rust-lang/crates.io-index",
    "sparse+https://index.crates.io/",
]
allow-git = []
